services:
  falkordb:
    # SEVER's engine (rule 3: remove it and the product breaks)
    image: falkordb/falkordb:6.0.0
    # survive host reboots / docker-daemon restarts — the same policy the
    # deployed demo box runs; `docker compose down` still removes it cleanly
    restart: unless-stopped
    ports:
      # SECURITY NOTE (audit/security): a bare "host:container" mapping binds
      # 0.0.0.0 — ALL interfaces. FalkorDB RESP ships with NO authentication
      # by default, so anyone who can reach this host on 6379 can read,
      # mutate, or GRAPH.DELETE every tenant graph; the browser UI on 3000
      # exposes the same data unauthenticated. Fine on an isolated demo box;
      # on anything shared, prefer loopback binds ("127.0.0.1:6379:6379")
      # or a firewall rule. Ports deliberately left unchanged per audit scope.
      - "6379:6379"   # RESP (Python client)
      - "3000:3000"   # browser UI — explore the tenant graphs live
    volumes:
      - ./out/falkordb-data:/data
    # optional server tuning — e.g. disable the default query timeout
    # for deep traversals: FALKORDB_ARGS=TIMEOUT_DEFAULT 0
    # environment:
    #   - FALKORDB_ARGS=TIMEOUT_DEFAULT 0
