# Render blueprint — SEVER console on FalkorDB Cloud
# Deploy: connect this repo in Render (New -> Blueprint) or via the Render CLI.
# The engine is the FalkorDB Cloud instance (managed by FalkorDB themselves);
# the console connects over RESP with the credentials below.
services:
  - type: web
    name: sever-console
    runtime: docker
    plan: free                 # spins down after ~15 min idle -> ~30-60s cold start on the
                               # next request; keep warm with a 10-min /api/state ping (README)
    region: singapore          # nearest Render region to ap-south-1 (Mumbai)
    # audit5/deploy-audit: Render's HTTP check must return 2xx within 5s.
    # /api/state runs 5 engine queries and measured 6-24s on FalkorDB Cloud
    # under concurrent load -> instance-restart loop + ephemeral-ledger wipes
    # (3 boots in 21 min, live-verified 2026-10-16). /api/health is ONE
    # cheap engine query and writes no receipt. NOTE: the running service's
    # health path lives in the Render dashboard — deploy this code first,
    # then flip the dashboard setting to /api/health.
    healthCheckPath: /api/health
    autoDeploy: false           # demo stability > branch churn; deploy on demand
    envVars:
      - key: SEVER_FALKOR_HOST
        sync: false             # your FalkorDB Cloud host (set in dashboard / via CLI)
      - key: SEVER_FALKOR_PORT
        sync: false
      - key: SEVER_FALKOR_USER
        value: falkordb
      - key: SEVER_FALKOR_PASSWORD
        sync: false             # secret — never in the repo
      - key: SEVER_FALKOR_GRAPH
        value: sever_demo
      - key: SEVER_SAMPLE_DIR
        value: /app/data/ad_sample
      # audit5/latency-forensics + incident-verify: 30s/10s defaults are generous
      # for a judge-facing demo — a stalled engine surfaces as a clean 503 in
      # ~10s instead of a half-minute hang (legitimate queries measured p95
      # <100ms direct; the boot-time auto-load runs before uvicorn binds).
      - key: SEVER_FALKOR_SOCKET_TIMEOUT
        value: "10"
      - key: SEVER_FALKOR_CONNECT_TIMEOUT
        value: "5"
      - key: SEVER_BACKEND
        generateValue: false    # documented as dead config; kept unset on purpose
# NOTE: the console is fail-fast at boot — SEVER_FALKOR_HOST/PORT/PASSWORD must
# point at a REACHABLE engine when the service starts (build_app() probes it at
# import time and exits on ConnectionError). An empty graph auto-loads the
# sample estate on first boot; an existing graph boots without reloading.
