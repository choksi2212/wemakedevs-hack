<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#A78BFA" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="720" fill="#FBFCFD"/>
  <text x="40" y="44" font-size="19" font-weight="700" fill="#1F2937">SEVER — system architecture</text>
  <text x="40" y="66" font-size="11" fill="#6B7280">one engine, one port, many tenants — the graph database IS the product</text>

  <!-- ===== operator + console (left column) ===== -->
  <rect x="40" y="110" width="220" height="64" rx="8" fill="rgba(59,130,246,0.07)" stroke="#93C5FD" stroke-width="1.25"/>
  <text x="150" y="136" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">Operator (browser)</text>
  <text x="150" y="152" font-size="9" fill="#6B7280" text-anchor="middle">human decides — nothing mutates without them</text>

  <rect x="40" y="250" width="220" height="150" rx="8" fill="rgba(59,130,246,0.07)" stroke="#93C5FD" stroke-width="1.25"/>
  <text x="150" y="276" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">SEVER console</text>
  <text x="150" y="292" font-size="9" fill="#6B7280" text-anchor="middle">FastAPI · schemas · 2-step gate UI</text>
  <text x="58" y="316" font-size="9" fill="#3B82F6">/api/state   /api/paths</text>
  <text x="58" y="331" font-size="9" fill="#3B82F6">/api/proposal /api/receipts</text>
  <text x="58" y="346" font-size="9" fill="#3B82F6">POST /api/finding</text>
  <text x="58" y="361" font-size="9" fill="#3B82F6">POST /api/cut  (approved:true)</text>
  <text x="58" y="380" font-size="8" fill="#6B7280">422 schema · 400 vocabulary · 403 gate</text>

  <!-- ===== agent (middle) ===== -->
  <rect x="360" y="250" width="240" height="110" rx="8" fill="rgba(16,185,129,0.07)" stroke="#6EE7B7" stroke-width="1.25"/>
  <text x="480" y="276" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">Investigator (agent)</text>
  <text x="480" y="292" font-size="9" fill="#6B7280" text-anchor="middle">sever/agent · the interdiction loop</text>
  <text x="378" y="316" font-size="9" fill="#059669">triage → proposal → HUMAN GATE</text>
  <text x="378" y="331" font-size="9" fill="#059669">→ cut → receipt (re-measured)</text>
  <text x="378" y="350" font-size="8" fill="#6B7280">greedy edge-frequency ranking over</text>
  <text x="378" y="362" font-size="8" fill="#6B7280">enumerated owned→jewel paths</text>

  <rect x="360" y="400" width="240" height="70" rx="8" fill="rgba(16,185,129,0.07)" stroke="#6EE7B7" stroke-width="1.25" stroke-dasharray="4,3"/>
  <text x="480" y="424" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">LLM seam (optional garnish)</text>
  <text x="480" y="440" font-size="9" fill="#6B7280" text-anchor="middle">OfflineNarrator (deterministic, default)</text>
  <text x="480" y="454" font-size="9" fill="#6B7280" text-anchor="middle">OpenAICompatLLM — narration only, never load-bearing</text>

  <!-- ===== port (engine adapter) ===== -->
  <rect x="700" y="250" width="220" height="110" rx="8" fill="rgba(16,185,129,0.07)" stroke="#6EE7B7" stroke-width="1.25"/>
  <text x="810" y="276" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">FalkorGraphPort</text>
  <text x="810" y="292" font-size="9" fill="#6B7280" text-anchor="middle">sever/core — THE GraphPort</text>
  <text x="718" y="316" font-size="9" fill="#059669">reachability (two-arm shortestPath)</text>
  <text x="718" y="331" font-size="9" fill="#059669">paths · frequency · greedy k-cut</text>
  <text x="718" y="346" font-size="9" fill="#059669">add_edge / cut / profile (receipts)</text>
  <text x="718" y="362" font-size="8" fill="#6B7280">closed rel vocabulary + \Z injection guard</text>

  <!-- ===== engine (right) ===== -->
  <rect x="1000" y="150" width="240" height="330" rx="10" fill="rgba(139,92,246,0.05)" stroke="#C4B5FD" stroke-width="1.25" stroke-dasharray="8,4"/>
  <text x="1120" y="178" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle">FalkorDB (the engine)</text>
  <text x="1120" y="194" font-size="9" fill="#6B7280" text-anchor="middle">falkordb 6.0.0 · self-hosted or Cloud</text>

  <rect x="1020" y="214" width="200" height="52" rx="6" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="1120" y="236" font-size="10" font-weight="600" fill="#7C3AED" text-anchor="middle">sever_demo</text>
  <text x="1120" y="252" font-size="8" fill="#6B7280" text-anchor="middle">1,480 nodes · 12,450 edges · 5 jewels</text>
  <rect x="1020" y="278" width="200" height="52" rx="6" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="1120" y="300" font-size="10" font-weight="600" fill="#7C3AED" text-anchor="middle">sever_hybrid</text>
  <text x="1120" y="316" font-size="8" fill="#6B7280" text-anchor="middle">AD + Entra · 14,422n · 9 SYNCED_TO bridges</text>
  <rect x="1020" y="342" width="200" height="52" rx="6" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="1120" y="364" font-size="10" font-weight="600" fill="#7C3AED" text-anchor="middle">sever_tenant001 … 300</text>
  <text x="1120" y="380" font-size="8" fill="#6B7280" text-anchor="middle">multi-tenant graph-per-tenant isolation</text>
  <rect x="1020" y="406" width="200" height="52" rx="6" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="1120" y="428" font-size="10" font-weight="600" fill="#7C3AED" text-anchor="middle">checkpoints + case memory</text>
  <text x="1120" y="444" font-size="8" fill="#6B7280" text-anchor="middle">FalkorDBSaver · cross-process resume</text>

  <!-- ===== ETL (bottom-left) ===== -->
  <rect x="360" y="510" width="240" height="64" rx="8" fill="rgba(100,116,139,0.06)" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="480" y="536" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">Collectors (input)</text>
  <text x="480" y="552" font-size="9" fill="#6B7280" text-anchor="middle">BloodHound CE JSON · AzureHound JSON</text>
  <text x="480" y="566" font-size="8" fill="#94A3B8" text-anchor="middle">public SpecterOps sample estates</text>

  <rect x="700" y="495" width="220" height="94" rx="8" fill="rgba(16,185,129,0.07)" stroke="#6EE7B7" stroke-width="1.25"/>
  <text x="810" y="521" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">ETL (sever/etl)</text>
  <text x="810" y="537" font-size="9" fill="#6B7280" text-anchor="middle">two-pass parse · deterministic hashes</text>
  <text x="718" y="557" font-size="9" fill="#059669">unresolved-principal materialization</text>
  <text x="718" y="571" font-size="9" fill="#059669">UNWIND MERGE batches (1000 rows)</text>
  <text x="718" y="585" font-size="8" fill="#6B7280">zero-dangling invariant · hostile-input fail-loud</text>

  <!-- ===== arrows ===== -->
  <line x1="150" y1="174" x2="150" y2="244" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="160" y="212" font-size="8" fill="#6B7280">HTTPS · clicks</text>
  <line x1="260" y1="300" x2="354" y2="300" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="268" y="292" font-size="8" fill="#6B7280">findings</text>
  <line x1="600" y1="300" x2="694" y2="300" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="608" y="292" font-size="8" fill="#6B7280">port API</text>
  <line x1="920" y1="300" x2="994" y2="300" stroke="#A78BFA" stroke-width="1.4" marker-end="url(#arrow-data)"/>
  <text x="928" y="292" font-size="8" fill="#7C3AED">RESP 6379</text>
  <line x1="480" y1="360" x2="480" y2="394" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="492" y="382" font-size="8" fill="#6B7280">optional</text>
  <line x1="600" y1="542" x2="694" y2="542" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="620" y="534" font-size="8" fill="#6B7280">parse</text>
  <line x1="810" y1="495" x2="810" y2="366" stroke="#A78BFA" stroke-width="1.4" marker-end="url(#arrow-data)"/>
  <text x="822" y="440" font-size="8" fill="#7C3AED">load()</text>
  <path d="M 480 574 L 480 620 L 810 620 L 810 589" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#arrow)"/>
  <text x="560" y="638" font-size="8" fill="#94A3B8">receipts JSONL (out/cases) · append-only ledger, one file per tenant</text>

  <!-- legend -->
  <rect x="40" y="656" width="1200" height="44" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="70" cy="678" r="5" fill="rgba(59,130,246,0.18)" stroke="#93C5FD"/><text x="82" y="682" font-size="9" fill="#475569">operator surface</text>
  <circle cx="200" cy="678" r="5" fill="rgba(16,185,129,0.18)" stroke="#6EE7B7"/><text x="212" y="682" font-size="9" fill="#475569">SEVER logic</text>
  <circle cx="320" cy="678" r="5" fill="rgba(139,92,246,0.18)" stroke="#C4B5FD"/><text x="332" y="682" font-size="9" fill="#475569">engine / graph data</text>
  <circle cx="470" cy="678" r="5" fill="rgba(100,116,139,0.18)" stroke="#CBD5E1"/><text x="482" y="682" font-size="9" fill="#475569">external input</text>
  <line x1="600" y1="678" x2="640" y2="678" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrow)"/><text x="650" y="682" font-size="9" fill="#475569">control flow</text>
  <line x1="760" y1="678" x2="800" y2="678" stroke="#A78BFA" stroke-width="1.4" marker-end="url(#arrow-data)"/><text x="810" y="682" font-size="9" fill="#475569">graph data flow</text>
  <text x="930" y="682" font-size="9" fill="#94A3B8">dashed = optional / boundary</text>
</svg>
