<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
    <marker id="cr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#FDA4AF" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="#FBFCFD"/>
  <text x="40" y="44" font-size="19" font-weight="700" fill="#1F2937">SEVER — control architecture (the interdiction loop)</text>
  <text x="40" y="66" font-size="11" fill="#6B7280">the agent proposes, the graph proves, the human decides — every mutation is receipted</text>

  <!-- row 1: finding stream -->
  <rect x="40" y="110" width="280" height="76" rx="8" fill="rgba(16,185,129,0.07)" stroke="#6EE7B7" stroke-width="1.25"/>
  <text x="180" y="138" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">finding stream</text>
  <text x="180" y="154" font-size="9" fill="#6B7280" text-anchor="middle">F-001 credential_breach</text>
  <text x="180" y="168" font-size="9" fill="#6B7280" text-anchor="middle">F-002 kerberoastable_spn · F-003 ace_granted</text>

  <!-- row 1: triage -->
  <rect x="380" y="110" width="280" height="76" rx="8" fill="rgba(16,185,129,0.07)" stroke="#6EE7B7" stroke-width="1.25"/>
  <text x="520" y="138" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">triage (investigator)</text>
  <text x="520" y="154" font-size="9" fill="#6B7280" text-anchor="middle">mark_owned → apply_finding (live)</text>
  <text x="520" y="168" font-size="9" fill="#6B7280" text-anchor="middle">snapshot before / after reachability</text>

  <!-- row 1: ATT&CK narration -->
  <rect x="720" y="110" width="260" height="76" rx="8" fill="rgba(16,185,129,0.07)" stroke="#6EE7B7" stroke-width="1.25" stroke-dasharray="4,3"/>
  <text x="850" y="138" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">narrate (ATT&CK)</text>
  <text x="850" y="154" font-size="9" fill="#6B7280" text-anchor="middle">T1078.002 · T1558.003 · T1098 …</text>
  <text x="850" y="168" font-size="9" fill="#6B7280" text-anchor="middle">operator-grade, honest, deterministic</text>

  <!-- row 2: the graph queries -->
  <rect x="380" y="250" width="280" height="96" rx="8" fill="rgba(139,92,246,0.05)" stroke="#C4B5FD" stroke-width="1.25"/>
  <text x="520" y="278" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">graph queries (FalkorGraphPort)</text>
  <text x="520" y="296" font-size="9" fill="#7C3AED" text-anchor="middle">reachability — two-arm all-pairs shortestPath</text>
  <text x="520" y="310" font-size="9" fill="#7C3AED" text-anchor="middle">paths_to_jewels — canonical + SPpaths ties</text>
  <text x="520" y="324" font-size="9" fill="#7C3AED" text-anchor="middle">edge_frequency — per (owned, jewel) path walk</text>
  <text x="520" y="338" font-size="8" fill="#6B7280" text-anchor="middle">measured live: 2.28ms re-query on the demo tenant</text>

  <!-- row 2: proposal ranking -->
  <rect x="60" y="250" width="240" height="96" rx="8" fill="rgba(16,185,129,0.07)" stroke="#6EE7B7" stroke-width="1.25"/>
  <text x="180" y="278" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">proposal (greedy k-cut)</text>
  <text x="180" y="296" font-size="9" fill="#6B7280" text-anchor="middle">rank edges by path coverage</text>
  <text x="180" y="310" font-size="9" fill="#6B7280" text-anchor="middle">never a phantom: ≥1 enumerated path</text>
  <text x="180" y="324" font-size="8" fill="#6B7280" text-anchor="middle">invariant-pinned: top is the argmax</text>

  <!-- HUMAN GATE — the centerpiece -->
  <rect x="380" y="410" width="280" height="130" rx="12" fill="rgba(244,63,94,0.06)" stroke="#FDA4AF" stroke-width="1.75"/>
  <text x="520" y="438" font-size="13" font-weight="700" fill="#BE123C" text-anchor="middle">⬤  THE HUMAN GATE</text>
  <text x="520" y="458" font-size="9" fill="#9F1239" text-anchor="middle">approve_and_cut passes ONLY on the exact value True</text>
  <text x="520" y="474" font-size="9" fill="#9F1239" text-anchor="middle">schema (StrictBool) + handler (identity) + test-pinned</text>
  <text x="520" y="492" font-size="9" fill="#6B7280" text-anchor="middle">UI: APPROVE CUT → CONFIRM CUT (two clicks)</text>
  <text x="520" y="508" font-size="8" fill="#6B7280" text-anchor="middle">32 pentest encodings: all fail closed — only JSON true passes</text>
  <text x="520" y="528" font-size="8" fill="#94A3B8" text-anchor="middle">unapproved → HTTP 403, nothing mutates, no oracle</text>

  <!-- cut + receipt -->
  <rect x="760" y="410" width="240" height="130" rx="8" fill="rgba(16,185,129,0.07)" stroke="#6EE7B7" stroke-width="1.25"/>
  <text x="880" y="438" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">cut + re-measure</text>
  <text x="880" y="456" font-size="9" fill="#6B7280" text-anchor="middle">DELETE the ranked edge, then RE-QUERY</text>
  <text x="880" y="474" font-size="9" fill="#059669" text-anchor="middle">verdict = measured claim</text>
  <text x="880" y="490" font-size="9" fill="#059669" text-anchor="middle">collapsed (0 after) · degraded (&gt;0 survives)</text>
  <text x="880" y="506" font-size="9" fill="#059669" text-anchor="middle">no_effect (nothing removed)</text>
  <text x="880" y="526" font-size="8" fill="#94A3B8" text-anchor="middle">a cut can never increase reachability (pinned)</text>

  <!-- ledger -->
  <rect x="1060" y="410" width="180" height="130" rx="8" fill="rgba(59,130,246,0.07)" stroke="#93C5FD" stroke-width="1.25"/>
  <text x="1150" y="438" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">receipts ledger</text>
  <text x="1150" y="456" font-size="9" fill="#6B7280" text-anchor="middle">append-only JSONL</text>
  <text x="1150" y="472" font-size="9" fill="#6B7280" text-anchor="middle">cross-process locked</text>
  <text x="1150" y="488" font-size="9" fill="#6B7280" text-anchor="middle">torn-tail self-repair</text>
  <text x="1150" y="504" font-size="9" fill="#6B7280" text-anchor="middle">every step, every failure</text>
  <text x="1150" y="524" font-size="8" fill="#94A3B8" text-anchor="middle">out/cases/&lt;tenant&gt;.jsonl</text>

  <!-- case memory -->
  <rect x="760" y="620" width="480" height="90" rx="8" fill="rgba(139,92,246,0.05)" stroke="#C4B5FD" stroke-width="1.25" stroke-dasharray="8,4"/>
  <text x="1000" y="648" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">case memory — IN the graph database (Track 2)</text>
  <text x="1000" y="666" font-size="9" fill="#7C3AED" text-anchor="middle">FalkorDBSaver checkpoints: pause at the gate, a FRESH process resumes (2.47ms live)</text>
  <text x="1000" y="682" font-size="9" fill="#7C3AED" text-anchor="middle">thread-isolated · corruption fail-closed · double-resume no-op</text>
  <text x="1000" y="700" font-size="8" fill="#94A3B8" text-anchor="middle">the human gate survives process death — approval state lives in the engine, not in RAM</text>

  <!-- arrows -->
  <line x1="320" y1="148" x2="374" y2="148" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ca)"/>
  <line x1="660" y1="148" x2="714" y2="148" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ca)"/>
  <line x1="520" y1="186" x2="520" y2="244" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ca)"/>
  <text x="530" y="220" font-size="8" fill="#6B7280">after-state feeds ranking</text>
  <line x1="380" y1="298" x2="304" y2="298" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ca)"/>
  <text x="316" y="290" font-size="8" fill="#6B7280">enumerate</text>
  <line x1="180" y1="346" x2="180" y2="470" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ca)"/>
  <text x="190" y="400" font-size="8" fill="#6B7280">proposal #1</text>
  <line x1="300" y1="470" x2="374" y2="470" stroke="#FDA4AF" stroke-width="1.6" marker-end="url(#cr)"/>
  <text x="306" y="462" font-size="8" fill="#BE123C">human decides</text>
  <line x1="660" y1="470" x2="754" y2="470" stroke="#FDA4AF" stroke-width="1.6" marker-end="url(#cr)"/>
  <text x="672" y="462" font-size="8" fill="#BE123C">approved:true</text>
  <line x1="1000" y1="470" x2="1054" y2="470" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#ca)"/>
  <text x="1008" y="462" font-size="8" fill="#6B7280">receipt</text>
  <path d="M 520 540 L 520 580 L 1000 580 L 1000 614" fill="none" stroke="#C4B5FD" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#ca)"/>
  <text x="600" y="572" font-size="8" fill="#7C3AED">gate state persisted at pause → resumable by any process</text>
  <path d="M 380 665 L 320 665 L 320 540" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="2,3" marker-end="url(#ca)"/>
  <text x="256" y="600" font-size="8" fill="#94A3B8">resume continues the loop</text>

  <!-- verdict strip -->
  <rect x="40" y="620" width="240" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="160" y="646" font-size="10" font-weight="600" fill="#1F2937" text-anchor="middle">verdict contract</text>
  <text x="60" y="668" font-size="9" fill="#059669">collapsed — nothing reachable after</text>
  <text x="60" y="684" font-size="9" fill="#D97706">degraded — paths remain, keep cutting</text>
  <text x="60" y="700" font-size="9" fill="#94A3B8">no_effect — honest no-op, still receipted</text>
</svg>
