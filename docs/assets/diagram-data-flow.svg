<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI', sans-serif">
  <defs>
    <marker id="da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
    <marker id="dg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="1280" height="700" fill="#FBFCFD"/>
  <text x="40" y="44" font-size="19" font-weight="700" fill="#1F2937">SEVER — data flow architecture</text>
  <text x="40" y="66" font-size="11" fill="#6B7280">from raw collector dumps to receipted interdiction — every arrow is a real script/query in this repo</text>

  <!-- stage 1: collectors -->
  <rect x="40" y="120" width="230" height="130" rx="8" fill="rgba(100,116,139,0.06)" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="155" y="146" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">① collectors (raw)</text>
  <text x="155" y="164" font-size="9" fill="#6B7280" text-anchor="middle">31 BloodHound CE JSON files</text>
  <text x="155" y="178" font-size="9" fill="#6B7280" text-anchor="middle">azurehound_example.json (29.8K records)</text>
  <text x="155" y="200" font-size="8" fill="#94A3B8" text-anchor="middle">public SpecterOps sample estates</text>
  <text x="155" y="212" font-size="8" fill="#94A3B8" text-anchor="middle">Apache-2.0 · synthetic identities</text>
  <text x="155" y="234" font-size="8" fill="#059669" text-anchor="middle">hostile-input tested: fail loud</text>

  <!-- stage 2: parse -->
  <rect x="350" y="120" width="230" height="130" rx="8" fill="rgba(16,185,129,0.07)" stroke="#6EE7B7" stroke-width="1.25"/>
  <text x="465" y="146" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">② ETL parse (two-pass)</text>
  <text x="465" y="164" font-size="9" fill="#6B7280" text-anchor="middle">sever/etl/ad_collectors.py · entra_collectors.py</text>
  <text x="368" y="184" font-size="8.5" fill="#059669">▪ camelCase RightName → SNAKE_UPPER rels</text>
  <text x="368" y="198" font-size="8.5" fill="#059669">▪ uncollected refs → unresolved principals</text>
  <text x="368" y="212" font-size="8.5" fill="#059669">▪ ACE inherited flags · trust directions</text>
  <text x="368" y="226" font-size="8.5" fill="#059669">▪ SYNCED_TO bridge pairs (bidirectional)</text>
  <text x="465" y="244" font-size="8" fill="#94A3B8" text-anchor="middle">deterministic: 3× byte-identical edge hashes</text>

  <!-- stage 3: normalized graph (in memory) -->
  <rect x="660" y="120" width="230" height="130" rx="8" fill="rgba(100,116,139,0.07)" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="775" y="146" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">③ NormalizedGraph</text>
  <text x="775" y="164" font-size="9" fill="#6B7280" text-anchor="middle">typed nodes · labeled edges · props</text>
  <text x="775" y="186" font-size="9" fill="#3B82F6" text-anchor="middle">AD: 1,480 nodes / 12,450 edges</text>
  <text x="775" y="202" font-size="9" fill="#3B82F6" text-anchor="middle">Entra: 12,942 / 16,723</text>
  <text x="775" y="218" font-size="9" fill="#3B82F6" text-anchor="middle">merged hybrid: 14,422 / 29,191 / 9 bridges</text>
  <text x="775" y="242" font-size="8" fill="#94A3B8" text-anchor="middle">zero dangling endpoints (invariant-pinned)</text>

  <!-- stage 4: load -->
  <rect x="970" y="120" width="270" height="130" rx="8" fill="rgba(100,116,139,0.05)" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="1105" y="146" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">④ UNWIND MERGE load</text>
  <text x="1105" y="164" font-size="9" fill="#6B7280" text-anchor="middle">sever/etl/cypher_batches.py</text>
  <text x="988" y="184" font-size="8.5" fill="#475569">▪ 1000-row batches, nodes then edges</text>
  <text x="988" y="198" font-size="8.5" fill="#475569">▪ $rows params — never f-strings (injection-proof)</text>
  <text x="988" y="212" font-size="8.5" fill="#475569">▪ range index per label on objectid</text>
  <text x="988" y="226" font-size="8.5" fill="#475569">▪ idempotent: re-load = identical counts</text>
  <text x="1105" y="246" font-size="8" fill="#94A3B8" text-anchor="middle">graph-per-tenant keys: sever_demo, sever_tenant001…</text>

  <!-- stage 5: queries row -->
  <rect x="350" y="330" width="560" height="120" rx="8" fill="rgba(100,116,139,0.05)" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="630" y="356" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">⑤ the live queries (all GRAPH.PROFILE-receipted)</text>
  <text x="370" y="380" font-size="9" fill="#475569">reachability: two-arm all-pairs shortestPath — 2 queries, not O(owned×jewels)</text>
  <text x="370" y="396" font-size="9" fill="#475569">canonical paths: shortestPath per (owned, jewel) — the hop chains the UI renders</text>
  <text x="370" y="412" font-size="9" fill="#475569">edge frequency: walk returned paths, count occurrences → greedy ranking</text>
  <text x="370" y="428" font-size="9" fill="#475569">cut: MATCH the ranked edge, DELETE, re-query — the measured verdict</text>
  <text x="370" y="444" font-size="8" fill="#94A3B8">planner truth documented: label-bound = Node By Index Scan 0.013ms · label-free = All Node Scan</text>

  <!-- stage 6: receipts + UI -->
  <rect x="350" y="500" width="270" height="120" rx="8" fill="rgba(100,116,139,0.07)" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="485" y="526" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">⑥ receipts</text>
  <text x="485" y="544" font-size="9" fill="#6B7280" text-anchor="middle">docs/receipts/*.json + out/cases/*.jsonl</text>
  <text x="485" y="562" font-size="9" fill="#3B82F6" text-anchor="middle">before/after · re-query ms · verdict</text>
  <text x="485" y="578" font-size="9" fill="#3B82F6" text-anchor="middle">approved_by · relationships_removed</text>
  <text x="485" y="600" font-size="8" fill="#94A3B8" text-anchor="middle">regenerable by the scripts — never hand-written</text>

  <rect x="680" y="500" width="270" height="120" rx="8" fill="rgba(100,116,139,0.07)" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="815" y="526" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">⑦ the console</text>
  <text x="815" y="544" font-size="9" fill="#6B7280" text-anchor="middle">attack surface · paths · proposals</text>
  <text x="815" y="560" font-size="9" fill="#6B7280" text-anchor="middle">2-step gate · receipts ledger</text>
  <text x="815" y="578" font-size="9" fill="#3B82F6" text-anchor="middle">live: sever-console.onrender.com</text>
  <text x="815" y="600" font-size="8" fill="#94A3B8" text-anchor="middle">WCAG-AA · keyboard-complete · zero AI slop</text>

  <!-- arrows -->
  <line x1="270" y1="185" x2="344" y2="185" stroke="#64748B" stroke-width="1.4" marker-end="url(#da)"/>
  <line x1="580" y1="185" x2="654" y2="185" stroke="#64748B" stroke-width="1.4" marker-end="url(#da)"/>
  <line x1="890" y1="185" x2="964" y2="185" stroke="#64748B" stroke-width="1.4" marker-end="url(#da)"/>
  <path d="M 1105 250 L 1105 290 L 630 290 L 630 324" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#da)"/>
  <line x1="520" y1="450" x2="480" y2="494" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#dg)"/>
  <line x1="740" y1="450" x2="800" y2="494" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#dg)"/>

  <!-- the tenant isolation note -->
  <rect x="40" y="330" width="270" height="290" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.25"/>
  <text x="175" y="358" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">multi-tenancy</text>
  <text x="175" y="378" font-size="9" fill="#6B7280" text-anchor="middle">graph-per-tenant key isolation</text>
  <rect x="70" y="396" width="210" height="40" rx="6" fill="rgba(100,116,139,0.05)" stroke="#CBD5E1" stroke-width="1"/>
  <text x="175" y="414" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">sever_tenant001</text>
  <text x="175" y="428" font-size="8" fill="#6B7280" text-anchor="middle">1,480n · 12,450e</text>
  <rect x="70" y="444" width="210" height="40" rx="6" fill="rgba(100,116,139,0.05)" stroke="#CBD5E1" stroke-width="1"/>
  <text x="175" y="462" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">sever_tenant002 …300</text>
  <text x="175" y="476" font-size="8" fill="#6B7280" text-anchor="middle">synthetic remap (SID shift · GUID)</text>
  <text x="175" y="512" font-size="9" fill="#059669" text-anchor="middle">300 tenants · 444,000 nodes</text>
  <text x="175" y="528" font-size="9" fill="#059669" text-anchor="middle">3,735,000 edges · one instance</text>
  <text x="175" y="548" font-size="9" fill="#D97706" text-anchor="middle">1.59 GiB RSS · median 4.67ms</text>
  <text x="175" y="568" font-size="9" fill="#D97706" text-anchor="middle">p95 4.81ms — FLAT</text>
  <text x="175" y="592" font-size="8" fill="#94A3B8" text-anchor="middle">the scale wall receipt</text>

  <!-- legend -->
  <rect x="40" y="656" width="1200" height="30" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="70" y1="671" x2="110" y2="671" stroke="#64748B" stroke-width="1.4" marker-end="url(#da)"/>
  <text x="120" y="675" font-size="9" fill="#475569">graph data flow</text>
  <line x1="240" y1="671" x2="280" y2="671" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#dg)"/>
  <text x="290" y="675" font-size="9" fill="#475569">operator / presentation</text>
  <text x="470" y="675" font-size="9" fill="#94A3B8">every number on this diagram is a live receipt in docs/receipts/ — nothing is illustrative</text>
</svg>
